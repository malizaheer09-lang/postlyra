<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Projects — Postlyra</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231F7A6C'/><rect x='25' y='25' width='50' height='50' rx='10' fill='%23E8633A'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --paper: #FAF6EF;
            --ink: #1E2A26;
            --ink-soft: #4A5650;
            --teal: #1F7A6C;
            --teal-deep: #16241F;
            --coral: #E8633A;
            --line: rgba(30, 42, 38, 0.12);
            --radius: 14px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
        }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
        .mono { font-family: 'IBM Plex Mono', monospace; }

        .nav {
            background: rgba(250, 246, 239, 0.92);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav__inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
        .logo-mark { width: 16px; height: 16px; border-radius: 4px; background: var(--teal); position: relative; }
        .logo-mark::after { content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; background: var(--coral); border-radius: 2px; transform: translate(-50%,-50%); }
        .nav__right { display: flex; align-items: center; gap: 18px; }
        .back-link { font-size: 14px; color: var(--ink-soft); }
        .back-link:hover { color: var(--ink); }
        .upload-link {
            background: var(--coral); color: #fff; font-weight: 600; font-size: 14px;
            padding: 9px 18px; border-radius: 8px;
        }
        .upload-link:hover { opacity: 0.92; }

        main { max-width: 1080px; margin: 0 auto; padding: 56px 32px 100px; }
        .eyebrow {
            font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em;
            color: var(--teal); text-transform: uppercase; margin-bottom: 14px; display: inline-block;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; margin-bottom: 10px; }
        .lead { color: var(--ink-soft); font-size: 16px; max-width: 560px; margin-bottom: 36px; }

        #empty-state {
            background: #fff; border: 1px dashed var(--line); border-radius: var(--radius);
            padding: 48px; text-align: center; color: var(--ink-soft); display: none;
        }
        #empty-state.visible { display: block; }
        #empty-state strong { color: var(--ink); display: block; margin-bottom: 8px; font-size: 17px; }
        #loading-state { color: var(--ink-soft); font-size: 14px; }

        .project-card {
            background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
            margin-bottom: 16px; overflow: hidden;
        }
        .project-summary {
            display: flex; align-items: center; gap: 16px; padding: 16px 20px; cursor: pointer;
        }
        .project-summary__thumb {
            width: 56px; height: 56px; border-radius: 9px; object-fit: cover;
            background: var(--teal-deep); flex-shrink: 0;
        }
        .project-summary__info { flex: 1; min-width: 0; }
        .project-summary__name { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
        .project-summary__meta { font-size: 12.5px; color: var(--ink-soft); }
        .project-summary__actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .view-btn, .delete-btn {
            font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
            border-radius: 7px; padding: 7px 14px; transition: all 0.2s;
        }
        .view-btn { background: none; border: 1px solid var(--line); color: var(--ink); }
        .view-btn:hover { border-color: var(--teal); color: var(--teal); }
        .delete-btn { background: none; border: 1px solid var(--line); color: var(--coral); }
        .delete-btn:hover { border-color: var(--coral); background: rgba(232,99,58,0.06); }

        .project-detail {
            border-top: 1px solid var(--line); padding: 24px 20px; display: none; background: var(--paper);
        }
        .project-detail.visible { display: block; }

        .platform-result { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
        .platform-result:last-child { margin-bottom: 0; }
        .platform-result__title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin-bottom: 14px; }
        .image-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
        .image-card { flex-shrink: 0; width: 140px; }
        .image-card__img { width: 140px; height: 140px; object-fit: contain; background: var(--teal-deep); border-radius: 9px; display: block; }
        .image-card__label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); margin-top: 5px; text-align: center; }

        .caption-panel { border-top: 1px solid var(--line); padding-top: 16px; }
        .caption-options { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .caption-option-btn {
            background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
            padding: 7px 13px; font-size: 12.5px; font-weight: 500; color: var(--ink-soft);
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .caption-option-btn.active { background: rgba(31,122,108,0.08); border-color: var(--teal); color: var(--teal); }
        .caption-textarea {
            width: 100%; min-height: 90px; font-family: inherit; font-size: 13.5px;
            color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
            padding: 11px 13px; resize: vertical; background: var(--paper);
        }
        .caption-textarea:focus { outline: none; border-color: var(--coral); background: #fff; box-shadow: 0 0 0 3px rgba(232,99,58,0.14); }
        .caption-panel__footer { display: flex; justify-content: flex-end; margin-top: 8px; }
        .copy-btn {
            background: none; border: 1px solid var(--line); border-radius: 7px; padding: 6px 13px;
            font-size: 12px; font-weight: 500; color: var(--ink); cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .copy-btn:hover { border-color: var(--teal); color: var(--teal); }
        .copy-btn.copied { border-color: var(--teal); color: var(--teal); background: rgba(31,122,108,0.06); }

        .banner { font-size: 13.5px; padding: 12px 16px; border-radius: 8px; margin-top: 18px; display: none; }
        .banner.visible { display: block; }
        .banner--error { background: rgba(232,99,58,0.10); color: #B8431E; }
    </style>
</head>
<body>
    <header class="nav">
        <div class="nav__inner">
            <a href="index.html" class="logo">
                <span class="logo-mark" aria-hidden="true"></span>
                Postlyra
            </a>
            <div class="nav__right">
                <a href="dashboard.html" class="back-link">← Back to dashboard</a>
                <a href="upload.html" class="upload-link">+ New upload</a>
            </div>
        </div>
    </header>

    <main>
        <span class="eyebrow">History</span>
        <h1>Your past projects</h1>
        <p class="lead">Every photo you've generated posts from, saved here so nothing gets lost when you close the tab.</p>

        <p id="loading-state">Loading your projects…</p>
        <div id="empty-state">
            <strong>No projects yet</strong>
            Upload a photo and it'll show up here automatically.
        </div>
        <div id="project-list"></div>
        <div class="banner banner--error" id="error-banner" role="alert"></div>
    </main>

    <script>
        (() => {
            const loadingState = document.getElementById('loading-state');
            const emptyState = document.getElementById('empty-state');
            const projectList = document.getElementById('project-list');
            const errorBanner = document.getElementById('error-banner');

            let platformLabels = {}; // platformId -> label, loaded alongside projects

            function showError(message) {
                errorBanner.textContent = message;
                errorBanner.classList.add('visible');
            }

            function formatDate(iso) {
                const d = new Date(iso);
                return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
                    ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            }

            function optionText(option) {
                return [option.caption, (option.hashtags || []).join(' ')].filter(Boolean).join('\n\n');
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function platformLabel(id) {
                return platformLabels[id] || id;
            }

            // Holds the real options arrays in memory, keyed by "uploadId:groupIndex"
            // (several projects can be expanded at once) — avoids ever having to
            // serialize AI-generated text into an HTML attribute.
            const optionsStore = {};

            function renderProjectDetail(upload) {
                const byPlatform = {};
                upload.platformVersions.forEach((v) => {
                    if (!byPlatform[v.platformId]) byPlatform[v.platformId] = [];
                    byPlatform[v.platformId].push(v);
                });

                return Object.entries(byPlatform).map(([platformId, versions], groupIndex) => {
                    const entry = upload.captions[platformId] || { options: [] };
                    const options = entry.options && entry.options.length > 0 ? entry.options : [{ caption: '', hashtags: [] }];
                    optionsStore[`${upload.id}:${groupIndex}`] = options;

                    const imagesHtml = versions.map((v) => `
                        <div class="image-card">
                            <img class="image-card__img" src="/api/uploads/${upload.id}/file/${v.platformId}/${v.formatId}" alt="${escapeHtml(v.label)}" loading="lazy" />
                            <div class="image-card__label">${escapeHtml(v.label)} · ${v.width}×${v.height}</div>
                        </div>
                    `).join('');

                    const optionButtonsHtml = options.map((opt, i) => `
                        <button type="button" class="caption-option-btn ${i === 0 ? 'active' : ''}" data-upload="${upload.id}" data-group="${groupIndex}" data-option-index="${i}">Option ${i + 1}</button>
                    `).join('');

                    return `
                        <div class="platform-result" data-upload="${upload.id}" data-group="${groupIndex}">
                            <h3 class="platform-result__title">${escapeHtml(platformLabel(platformId))}</h3>
                            <div class="image-row">${imagesHtml}</div>
                            <div class="caption-panel">
                                <div class="caption-options">${optionButtonsHtml}</div>
                                <textarea class="caption-textarea" data-upload="${upload.id}" data-group="${groupIndex}">${escapeHtml(optionText(options[0]))}</textarea>
                                <div class="caption-panel__footer">
                                    <button type="button" class="copy-btn" data-upload="${upload.id}" data-group="${groupIndex}">Copy caption</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function wireUpDetail(detailEl) {
                detailEl.querySelectorAll('.platform-result').forEach((block) => {
                    const options = optionsStore[`${block.dataset.upload}:${block.dataset.group}`];
                    const textarea = block.querySelector('.caption-textarea');

                    block.querySelectorAll('.caption-option-btn').forEach((btn) => {
                        btn.addEventListener('click', () => {
                            block.querySelectorAll('.caption-option-btn').forEach((b) => b.classList.remove('active'));
                            btn.classList.add('active');
                            textarea.value = optionText(options[Number(btn.dataset.optionIndex)]); // .value, not innerHTML — no escaping needed here
                        });
                    });

                    const copyBtn = block.querySelector('.copy-btn');
                    copyBtn.addEventListener('click', async () => {
                        try {
                            await navigator.clipboard.writeText(textarea.value);
                            copyBtn.textContent = 'Copied!';
                            copyBtn.classList.add('copied');
                            setTimeout(() => { copyBtn.textContent = 'Copy caption'; copyBtn.classList.remove('copied'); }, 1800);
                        } catch {
                            showError('Could not copy to clipboard. Select and copy the text manually.');
                        }
                    });
                });
            }

            function renderProjects(uploads) {
                if (uploads.length === 0) {
                    emptyState.classList.add('visible');
                    return;
                }

                projectList.innerHTML = uploads.map((upload) => {
                    const firstVersion = upload.platformVersions[0];
                    const thumbUrl = firstVersion ? `/api/uploads/${upload.id}/file/${firstVersion.platformId}/${firstVersion.formatId}` : '';
                    const platformCount = new Set(upload.platformVersions.map((v) => v.platformId)).size;
                    const sizeCount = upload.platformVersions.length;

                    return `
                        <div class="project-card" data-id="${upload.id}">
                            <div class="project-summary" data-toggle="${upload.id}">
                                <img class="project-summary__thumb" src="${thumbUrl}" alt="" />
                                <div class="project-summary__info">
                                    <div class="project-summary__name">${escapeHtml(upload.originalFilename)}</div>
                                    <div class="project-summary__meta">${formatDate(upload.createdAt)} · ${platformCount} platform${platformCount === 1 ? '' : 's'}, ${sizeCount} size${sizeCount === 1 ? '' : 's'}</div>
                                </div>
                                <div class="project-summary__actions">
                                    <button type="button" class="view-btn" data-toggle-btn="${upload.id}">View</button>
                                    <a href="publish.html?uploadId=${upload.id}" class="view-btn" style="background:var(--teal);color:#fff;border-color:var(--teal);text-decoration:none;display:inline-flex;align-items:center;">Publish</a>
                                    <button type="button" class="delete-btn" data-delete="${upload.id}">Delete</button>
                                </div>
                            </div>
                            <div class="project-detail" id="detail-${upload.id}"></div>
                        </div>
                    `;
                }).join('');

                // Lazy-render detail content the first time a project is expanded.
                const rendered = new Set();
                function toggle(uploadId) {
                    const detail = document.getElementById(`detail-${uploadId}`);
                    const btn = document.querySelector(`[data-toggle-btn="${uploadId}"]`);
                    const isVisible = detail.classList.contains('visible');

                    if (!isVisible && !rendered.has(uploadId)) {
                        const upload = uploads.find((u) => u.id === uploadId);
                        detail.innerHTML = renderProjectDetail(upload);
                        wireUpDetail(detail);
                        rendered.add(uploadId);
                    }

                    detail.classList.toggle('visible', !isVisible);
                    btn.textContent = !isVisible ? 'Hide' : 'View';
                }

                projectList.querySelectorAll('[data-toggle]').forEach((el) => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('[data-delete]')) return; // don't toggle when clicking delete
                        toggle(el.dataset.toggle);
                    });
                });

                projectList.querySelectorAll('[data-delete]').forEach((btn) => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const uploadId = btn.dataset.delete;
                        if (!confirm('Delete this project? This removes its photos and captions permanently.')) return;

                        try {
                            const res = await fetch(`/api/uploads/${uploadId}`, { method: 'DELETE' });
                            if (!res.ok) throw new Error('Delete failed');
                            document.querySelector(`.project-card[data-id="${uploadId}"]`).remove();
                            if (document.querySelectorAll('.project-card').length === 0) {
                                emptyState.classList.add('visible');
                            }
                        } catch {
                            showError('Could not delete that project. Please try again.');
                        }
                    });
                });
            }

            (async () => {
                try {
                    const [platformsRes, uploadsRes] = await Promise.all([
                        fetch('/api/uploads/platforms'),
                        fetch('/api/uploads'),
                    ]);
                    if (!platformsRes.ok || !uploadsRes.ok) throw new Error('Failed to load');

                    const platformsData = await platformsRes.json();
                    platformLabels = Object.fromEntries(platformsData.platforms.map((p) => [p.id, p.label]));

                    const uploadsData = await uploadsRes.json();
                    loadingState.style.display = 'none';
                    renderProjects(uploadsData.uploads);
                } catch (err) {
                    loadingState.style.display = 'none';
                    showError('Could not load your past projects. Refresh the page to try again.');
                }
            })();
        })();
    </script>
</body>
</html>
